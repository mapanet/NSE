<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MapLibre GeoJSON Viewer</title>
  <link href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.js"></script>

  <style>
    body { margin: 0; }
    #map { width: 100vw; height: 100vh; }
    #rightPanel {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 10px;
      border-radius: 6px;
      font-family: Arial;
      width: 220px;
      box-shadow: 0 0 6px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body>
<div id="map"></div>
<div id="rightPanel">Hover a polygon</div>

<script>
const nseColors = {
  "A/B": "#8B0000",
  "C+": "#E53935",
  "C": "#FB8C00",
  "C-": "#FDD835",
  "D+": "#7CB342",
  "D": "#1E88E5",
  "E": "#6A1B9A",
  "N/A": "#424343"
};

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://demotiles.maplibre.org/style.json',
  center: [-99.1332, 19.4326],
  zoom: 6
});

map.on('load', () => {

  // Load GeoJSON
  map.addSource('colonias', {
    type: 'geojson',
    data: './09-mexico.geojson'
  });

  // Fill layer
  map.addLayer({
    id: 'colonias-fill',
    type: 'fill',
    source: 'colonias',
    paint: {
      'fill-color': [
        'match',
        ['get', 'nse'],
        'A/B', '#8B0000',
        'C+', '#E53935',
        'C', '#FB8C00',
        'C-', '#FDD835',
        'D+', '#7CB342',
        'D', '#1E88E5',
        'E', '#6A1B9A',
        '#424343'
      ],
      'fill-opacity': 0.35
    }
  });

  // Outline layer
  map.addLayer({
    id: 'colonias-outline',
    type: 'line',
    source: 'colonias',
    paint: {
      'line-color': '#000',
      'line-width': 1
    }
  });

  // Hover tooltip
  const popup = new maplibregl.Popup({
    closeButton: false,
    closeOnClick: false
  });

  map.on('mousemove', 'colonias-fill', (e) => {
    const f = e.features[0];
    const props = f.properties;

    popup
      .setLngLat(e.lngLat)
      .setHTML(`<b>${props.name}</b><br>NSE: ${props.nse}<br>CVEGEO: ${props.cvegeo}`)
      .addTo(map);

    document.getElementById("rightPanel").innerHTML =
      `<b>${props.name}</b><br>
       Category: ${props.category}<br>
       NSE: ${props.nse_label}<br>
       CVEGEO: ${props.cvegeo}`;
  });

  map.on('mouseleave', 'colonias-fill', () => {
    popup.remove();
  });

});
</script>
</body>
</html>
